{% if page.cards %}
<section class="section">
  <div class="container">
    <div class="section__header fade-in-up">
      <h2>Explore the Platform</h2>
      <p>Everything you need for multi-omics research in one place</p>
    </div>
    <div class="card-grid stagger-children">
      {% for card in page.cards %}
      <a href="{{ card.url | relative_url }}" class="card">
        <span class="card__icon" aria-hidden="true">{{ card.icon }}</span>
        <h3 class="card__title">{{ card.title }}</h3>
        <p class="card__description">{{ card.description }}</p>
        <span class="card__arrow">Learn more &rarr;</span>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
