{% if page.layout == 'home' %}
<section class="hero hero--home">
  <div class="hero__content">
    <div class="hero__header">
      <img src="{{ '/assets/images/Logo_InTraC.png' | relative_url }}" alt="InTraC Logo" class="hero__logo" />
      <div class="hero__header-text">
        <h1 class="hero__title">{{ page.hero_title | default: site.title }}</h1>
        <p class="hero__subtitle">{{ page.hero_subtitle | default: site.description }}</p>
      </div>
    </div>
    <div class="hero__links">
      <a href="{{ '/docs/platform' | relative_url }}" class="hero__link">Analysis Platform</a>
      <span class="hero__link-sep">&middot;</span>
      <a href="https://nefeli.helmholtz-muenchen.de" class="hero__link">NEFELI <span>&nearr;</span></a>
      <span class="hero__link-sep">&middot;</span>
      <a href="https://github.com/InTraC-CRC1784" class="hero__link">GitHub <span>&nearr;</span></a>
      <span class="hero__link-sep">&middot;</span>
      <a href="mailto:tbd" class="hero__link">Contact <span>&nearr;</span></a>
    </div>
  </div>
</section>
{% else %}
<section class="hero hero--page">
  <div class="container">
    <div class="hero__content">
      <h1 class="hero__page-title">{{ page.title }}</h1>
      {% if page.description %}<p class="hero__description">{{ page.description }}</p>{% endif %}
    </div>
  </div>
</section>
{% endif %}
